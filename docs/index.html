<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web名刺 サンプル一覧</title>
    <style>
      :root {
        --bg: #0f1117;
        --card: #1a1d27;
        --text: #e8eaf0;
        --muted: #8b90a0;
        --line: rgba(232, 234, 240, 0.1);
        --accent: #7c8cf8;
        --font: "Hiragino Sans", "Noto Sans JP", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100dvh;
        padding: 48px 24px 64px;
        color: var(--text);
        background: var(--bg);
        font-family: var(--font);
      }

      header {
        max-width: 640px;
        margin: 0 auto 48px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
      }

      .desc {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
        max-width: 640px;
        margin: 0 auto;
        list-style: none;
      }

      .item {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        text-decoration: none;
        color: inherit;
        transition: border-color 0.15s;
      }

      .item:hover {
        border-color: var(--accent);
      }

      .item-name {
        font-size: 16px;
        font-weight: 700;
      }

      .item-meta {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.6;
      }

      .item-arrow {
        margin-top: auto;
        padding-top: 12px;
        color: var(--accent);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Web名刺 サンプル一覧</h1>
      <p class="desc">
        NFC Web名刺ワークショップの完成例です。<br />
        各カードをタップして名刺を確認できます。
      </p>
    </header>

    <ul class="grid" role="list">
      <li>
        <a class="item" href="./sample-v1/">
          <span class="item-name">山田太郎</span>
          <span class="item-meta">フロントエンドエンジニア<br />ダーク / 写真カルーセル / コンパクト名刺</span>
          <span class="item-arrow">名刺を見る →</span>
        </a>
      </li>
      <li>
        <a class="item" href="./sample-v2/">
          <span class="item-name">田中太郎</span>
          <span class="item-meta">フロントエンドエンジニア<br />ダーク / 写真カルーセル / 動き多め</span>
          <span class="item-arrow">名刺を見る →</span>
        </a>
      </li>
    </ul>
  </body>
</html>
